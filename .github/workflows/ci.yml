name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal && rustup default stable-x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxkbcommon-x11-0 libxss1 xvfb xcompmgr imagemagick x11-xserver-utils x11-utils
      - uses: Swatinem/rust-cache@v2
      - run: xvfb-run -a cargo test
      - run: cargo build
      - name: smoke (compositor)
        run: bash tools/ci/smoke-linux.sh composited
      - name: smoke (no compositor)
        if: always()
        run: bash tools/ci/smoke-linux.sh bare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-shots
          path: "*.png"

  # macOS minutes count 10x on a private repo: tags and manual runs only
  test-macos:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

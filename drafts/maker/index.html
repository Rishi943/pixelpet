<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pet maker, pixel window</title>
<style>
  html, body { margin:0; height:100%; }
  body { background: linear-gradient(160deg, #3d6e9c 0%, #27466b 55%, #1b2f4a 100%); font: 13px "Segoe UI", system-ui, sans-serif; color:#dfe7f0; overflow:hidden; }
  .caption { position:absolute; top:12px; left:16px; opacity:.85; }
  .taskbar { position:absolute; left:0; right:0; bottom:0; height:48px; background:#1c1f26ee; border-top:1px solid #0006; }
  canvas#ui { position:absolute; image-rendering:pixelated; cursor:default; }
</style>
</head>
<body>
<div class="caption">Mockup: the maker as a small PixelPet window over your desktop, drawn in the app's own pixel font and menu colours. First launch opens it by itself. Click, drag the sliders, type a name.</div>
<div class="taskbar"></div>
<canvas id="ui"></canvas>

<script src="../looks/rig.js"></script>
<script src="../looks/rabbit.js"></script>
<script src="font.js"></script>
<script>
(() => {
  const Rig = window.PixelRig, BASE = Rig.LOOKS.classic, FONT = window.PIXEL_FONT;
  const Z = 3;                       // screen px per UI art px (size M)
  const W = 236, H = 132;            // window size in art px
  const OUTLINE = '#24120A', FILL = '#F3D29C', SHADE = '#E7C080', TEXT = '#24120A', DIM = '#8E6E48', SEL = '#2F64C8', SELTXT = '#FFFFFF';

  // ---------- colours: one picked colour -> the 4 shades of a family
  const hx = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
  const toHex = c => '#' + c.map(v => Math.round(Math.max(0, Math.min(1, v)) * 255).toString(16).padStart(2, '0')).join('');
  function rgb2hsl([r, g, b]) {
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
    if (!d) return [0, 0, l];
    const s = d / (1 - Math.abs(2 * l - 1));
    const h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return [(h * 60 + 360) % 360, s, l];
  }
  function hsl2rgb([h, s, l]) {
    const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
    const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
    return [r + m, g + m, b + m];
  }
  function family(hex) {
    const [h, s, l] = rgb2hsl(hx(hex));
    return [[h - 6, Math.min(1, s * 1.1), l * 0.42], [h - 3, Math.min(1, s * 1.05), l * 0.7], [h, s, l], [h + 4, s * 0.92, Math.min(0.97, l * 1.25 + 0.05)]]
      .map(([a, b, c]) => toHex(hsl2rgb([(a + 360) % 360, b, c])));
  }

  // ---------- what can be changed
  const SLIDERS = [['legLen', 'Legs', 0.6, 1.3], ['bodyLen', 'Body', 0.75, 1.25], ['head', 'Head', 0.9, 1.5], ['ear', 'Ears', 0.6, 1.5],
                   ['muzzle', 'Muzzle', 0.7, 1.3], ['tail', 'Tail', 0.4, 1.5], ['fluff', 'Fluff', 0.9, 1.35]];
  const DOG_AREAS = [['tan', 'Coat'], ['black', 'Saddle'], ['cream', 'Legs'], ['mask', 'Mask'], ['collar', 'Collar']];
  const BUN_AREAS = [['white', 'Coat'], ['brown', 'Patches'], ['pink', 'Ears']];
  const SWATCH = ['#C47637', '#E2B077', '#D9C27A', '#F3F0EB', '#9AA0A8', '#5A6068', '#231B1B', '#6E3B22'];
  const COLLARS = ['#2F64C8', '#C8384A', '#3E9A57', '#E0A030', '#7A4CC0', '#231B1B', '#F3F0EB', '#D86AA0'];
  const BREEDS = {
    dog: [
      { name: 'Alex the GSD', body: {}, coat: {} },
      { name: 'Yellow Lab', body: { ear: 0.78, fluff: 0.96, muzzle: 1.05 }, coat: { tan: '#D9B26F', black: '#C9A060', cream: '#E8CC92', mask: '#C9A060' } },
      { name: 'Black Lab', body: { ear: 0.78, fluff: 0.96, muzzle: 1.05 }, coat: { tan: '#2A2424', black: '#231E1E', cream: '#2F2828', mask: '#231E1E' } },
      { name: 'Husky', body: { ear: 0.95, fluff: 1.2, tail: 1.1 }, coat: { tan: '#E8E6E2', black: '#5A6068', cream: '#F3F1EC', mask: '#6A7078' } },
      { name: 'Golden', body: { ear: 0.75, fluff: 1.3, tail: 1.25 }, coat: { tan: '#C98A3A', black: '#B77A32', cream: '#DDA65A', mask: '#B77A32' } },
      { name: 'Corgi', body: { legLen: 0.62, bodyLen: 1.15, ear: 1.35, tail: 0.45 }, coat: { tan: '#C8703A', black: '#B9622F', cream: '#F2E6D6', mask: '#C8703A' } },
    ],
    rabbit: [
      { name: 'Alex the bun', body: {}, coat: {} },
      { name: 'Grey', body: {}, coat: { white: '#9AA0A8', brown: '#6A7078', pink: '#C9A7A0' } },
      { name: 'Black and white', body: {}, coat: { white: '#F3F0EB', brown: '#2A2424', pink: '#D6A799' } },
    ]
  };
  const NAMES = ['Biscuit', 'Pixel', 'Mango', 'Pepper', 'Comet', 'Noodle', 'Toffee', 'Bean'];
  const STEPS = ['Animal', 'Breed', 'Shape', 'Coat', 'Name'];
  const STEP_ANIM = ['stand', 'stand', 'walk', 'sit', 'tilt'];

  const st = { step: 0, reached: 0, sp: 'dog', breed: 0, body: { ...BASE.body }, coat: {}, name: 'Alex', anim: 'stand', t0: performance.now(), done: false, drag: null };
  const basePal = () => (st.sp === 'dog' ? Rig.ALEX : Rig.BUN);
  const coatOf = k => st.coat[k] || (k === 'collar' ? '#2F64C8' : basePal()[k][2]);
  function applyBreed(i) {
    const b = BREEDS[st.sp][i];
    st.breed = i; st.body = { ...BASE.body };
    for (const [k, v] of Object.entries(b.body)) st.body[k] = BASE.body[k] * v;
    st.coat = { ...b.coat };
    st.name = i === 0 ? (st.sp === 'dog' ? 'Alex' : 'Alex the bun') : NAMES[Math.floor(Math.random() * NAMES.length)];
  }
  function go(i) { st.step = i; st.reached = Math.max(st.reached, i); st.anim = STEP_ANIM[i]; st.t0 = performance.now(); st.done = false; }
  function randomise() {
    const r = (a, b) => a + Math.random() * (b - a);
    if (st.sp === 'dog') for (const [k, , lo, hi] of SLIDERS) st.body[k] = BASE.body[k] * r(lo, hi);
    for (const [k] of (st.sp === 'dog' ? DOG_AREAS : BUN_AREAS)) st.coat[k] = (k === 'collar' ? COLLARS : SWATCH)[Math.floor(Math.random() * 8)];
    st.name = NAMES[Math.floor(Math.random() * NAMES.length)];
  }

  // ---------- pixel drawing on an art-px buffer
  const cv = document.getElementById('ui'), ctx = cv.getContext('2d');
  cv.width = W * Z; cv.height = H * Z;
  const art = document.createElement('canvas'); art.width = W; art.height = H;
  const a = art.getContext('2d');
  let hits = [];
  const rect = (x, y, w, h, c) => { a.fillStyle = c; a.fillRect(x, y, w, h); };
  const box = (x, y, w, h, fill, line) => { rect(x, y, w, h, line); rect(x + 1, y + 1, w - 2, h - 2, fill); };
  function text(s, x, y, c) {
    a.fillStyle = c;
    for (const ch of s) {
      const g = FONT[ch.charCodeAt(0) - 32] || FONT[0];
      for (let r = 0; r < 7; r++) for (let b = 0; b < 5; b++) if (g[r] & (16 >> b)) a.fillRect(x + b, y + r, 1, 1);
      x += 6;
    }
    return x;
  }
  const tw = s => s.length * 6 - 1;
  function button(label, x, y, on, fn, w) {
    w = w || tw(label) + 6;
    if (on) rect(x, y, w, 11, SEL);
    text(label, x + 3, y + 2, on ? SELTXT : TEXT);
    hits.push({ x, y, w, h: 11, fn });
    return x + w;
  }

  // ---------- the pet preview (real rig, actual size M = 3 screen px per rig px)
  function petFrame(anim, t) {
    const look = { ...BASE, body: { ...st.body } }, pal = { ...basePal() };
    for (const [k, v] of Object.entries(st.coat)) pal[k] = family(v);
    if (!Rig.anim(st.sp, anim)) anim = 'stand';
    return Rig.render(Rig.pose(anim, look, t, { species: st.sp }), look, { palette: pal, collar: st.sp === 'dog' });
  }
  const sprite = document.createElement('canvas'), sctx = sprite.getContext('2d');

  // ---------- one frame
  const PX = 6, PY = 18, PW = 92, PH = 96, GROUND = PY + PH - 10;   // preview box, art px
  const RX = 106, RW = W - RX - 6;                                      // right column
  function draw(now) {
    hits = [];
    box(0, 0, W, H, FILL, OUTLINE);
    text('Make a pet', 6, 5, TEXT);
    // step dots, right of the title
    STEPS.forEach((n, i) => {
      const x = W - 6 - (STEPS.length - i) * 7 + 2, y = 6;
      if (i === st.step) rect(x, y, 5, 5, SEL);
      else if (i <= st.reached) { rect(x, y, 5, 5, TEXT); }
      else { box(x, y, 5, 5, FILL, DIM); }
      if (i <= st.reached) hits.push({ x: x - 1, y: y - 1, w: 7, h: 7, fn: () => go(i) });
    });
    rect(1, 15, W - 2, 1, OUTLINE);
    // preview box
    box(PX, PY, PW, PH, SHADE, OUTLINE);
    rect(PX + 4, GROUND, PW - 8, 1, DIM);
    text(st.name.slice(0, 14), PX + Math.round((PW - tw(st.name.slice(0, 14))) / 2), PY + 4, TEXT);
    // right column: the step
    const title = STEPS[st.step], count = `${st.step + 1}/${STEPS.length}`;
    text(title, RX, PY + 1, TEXT);
    text(count, W - 6 - tw(count), PY + 1, DIM);
    let y = PY + 14;
    if (st.step === 0) {
      for (const [sp, label] of [['dog', 'Dog'], ['rabbit', 'Rabbit']]) {
        button(label, RX, y, st.sp === sp, () => { st.sp = sp; applyBreed(0); go(1); }, RW); y += 12;
      }
      text('Cat (later)', RX + 3, y + 2, DIM);
    } else if (st.step === 1) {
      BREEDS[st.sp].forEach((b, i) => { button(b.name, RX, y, st.breed === i, () => applyBreed(i), RW); y += 12; });
    } else if (st.step === 2) {
      if (st.sp !== 'dog') text('Not for rabbits yet', RX, y + 2, DIM);
      else for (const [k, label, lo, hi] of SLIDERS) {
        text(label, RX, y + 2, TEXT);
        const bx = RX + 40, bw = RW - 40, v = (st.body[k] / BASE.body[k] - lo) / (hi - lo);
        rect(bx, y + 5, bw, 1, DIM);
        rect(bx, y + 5, Math.round(bw * v), 1, SEL);
        const kx = bx + Math.round((bw - 3) * v);
        box(kx, y + 2, 3, 7, FILL, OUTLINE);
        hits.push({ x: bx - 2, y, w: bw + 4, h: 11, slide: { k, lo, hi, bx, bw } });
        y += 12;
      }
    } else if (st.step === 3) {
      for (const [k, label] of (st.sp === 'dog' ? DOG_AREAS : BUN_AREAS)) {
        text(label, RX, y + 2, TEXT);
        const cur = coatOf(k).toLowerCase();
        (k === 'collar' ? COLLARS : SWATCH).forEach((c, i) => {
          const x = RX + 44 + i * 10;
          if (c.toLowerCase() === cur) rect(x - 1, y, 10, 11, SEL);
          box(x, y + 1, 8, 9, c, OUTLINE);
          hits.push({ x: x - 1, y, w: 10, h: 11, fn: () => { st.coat[k] = c; } });
        });
        y += 14;
      }
    } else {
      text('Type a name', RX, y + 1, DIM);
      y += 12;
      box(RX, y, RW, 13, '#FFF6E4', OUTLINE);
      const shown = st.name.slice(-18);
      const end = text(shown, RX + 3, y + 3, TEXT);
      if (Math.floor(now / 500) % 2) rect(end, y + 2, 1, 9, TEXT);
      y += 20;
      text(st.done ? `${st.name} is home!` : 'Then they hop onto', RX, y, st.done ? SEL : DIM);
      if (!st.done) text('your taskbar.', RX, y + 9, DIM);
    }
    // bottom row
    rect(1, H - 16, W - 2, 1, OUTLINE);
    const by = H - 13;
    if (st.step > 0) button('< Back', RX, by, false, () => go(st.step - 1));
    button('Random', PX + 2, by, false, randomise);
    const last = st.step === STEPS.length - 1, nl = last ? 'Done' : 'Next >';
    button(nl, W - 6 - (tw(nl) + 6), by, true, () => { if (last) { st.done = true; st.anim = 'hop'; st.t0 = performance.now(); } else go(st.step + 1); });

    // compose: UI art scaled up, then the pet at its real on-screen size
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.drawImage(art, 0, 0, W * Z, H * Z);
    const t = Math.floor((now - st.t0) / 1000 * 12) / 12;
    const f = petFrame(st.anim, t);
    sprite.width = f.w; sprite.height = f.h;
    sctx.putImageData(new ImageData(new Uint8ClampedArray(f.data), f.w, f.h), 0, 0);
    const pz = 3;
    const px = (PX + PW / 2) * Z - f.ox * pz, py = (GROUND + 1) * Z - (f.gy + 1) * pz;
    ctx.save();
    ctx.beginPath(); ctx.rect((PX + 1) * Z, (PY + 12) * Z, (PW - 2) * Z, (PH - 13) * Z); ctx.clip();
    ctx.drawImage(sprite, px, py, f.w * pz, f.h * pz);
    ctx.restore();
    requestAnimationFrame(draw);
  }

  // ---------- input
  function artXY(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / Z, (e.clientY - r.top) / Z]; }
  function slideTo(s, x) {
    const v = Math.max(0, Math.min(1, (x - s.bx) / s.bw));
    st.body[s.k] = BASE.body[s.k] * (s.lo + v * (s.hi - s.lo));
  }
  cv.addEventListener('pointerdown', e => {
    const [x, y] = artXY(e);
    const h = hits.find(h => x >= h.x && x < h.x + h.w && y >= h.y && y < h.y + h.h);
    if (!h) return;
    if (h.slide) { st.drag = h.slide; slideTo(h.slide, x); cv.setPointerCapture(e.pointerId); }
    else h.fn();
  });
  cv.addEventListener('pointermove', e => { if (st.drag) slideTo(st.drag, artXY(e)[0]); });
  cv.addEventListener('pointerup', () => { st.drag = null; });
  window.addEventListener('keydown', e => {
    if (st.step !== STEPS.length - 1) return;
    if (e.key === 'Backspace') st.name = st.name.slice(0, -1);
    else if (e.key === 'Enter') { st.done = true; st.anim = 'hop'; st.t0 = performance.now(); }
    else if (e.key.length === 1 && e.key >= ' ' && e.key <= '~' && st.name.length < 24) st.name += e.key;
    e.preventDefault();
  });

  function place() {
    cv.style.left = Math.max(8, (innerWidth - W * Z) / 2) + 'px';
    cv.style.top = Math.max(40, (innerHeight - 48 - H * Z) / 2) + 'px';
  }
  addEventListener('resize', place);
  place();
  applyBreed(0);
  // #N opens step N (for checking each screen)
  const want = +location.hash.slice(1) || 0;   // #N opens step N
  for (let i = 0; i <= want; i++) go(i);
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>

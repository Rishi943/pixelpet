[package]
name = "pixelpet"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "PixelPet"
path = "src/main.rs"

[dependencies]
winit = "0.30"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "=0.52.0"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
]

# the X11 crate winit already uses; shape/randr/screensaver add no crates
[target.'cfg(target_os = "linux")'.dependencies.x11rb]
version = "=0.13.2"
default-features = false
features = ["allow-unsafe-code", "dl-libxcb", "image", "shape", "randr", "screensaver"]

[[test]]
name = "window_hit"
harness = false

[package]
name = "pixelpet"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "PixelPet"
path = "src/main.rs"

[dependencies]
png = "0.18.1"
winit = "0.30"
zune-jpeg = "0.5.15"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "=0.52.0"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
]

# the X11 crate winit already uses; shape/randr/screensaver add no crates
[target.'cfg(target_os = "linux")'.dependencies.x11rb]
version = "=0.13.2"
default-features = false
features = ["allow-unsafe-code", "dl-libxcb", "image", "shape", "randr", "screensaver"]

# the macOS crates winit already uses
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.5.3"
objc2-foundation = { version = "=0.2.2", features = ["NSString", "NSGeometry", "NSArray", "NSURL"] }
# already in the lock file through winit; only the open panel's features
objc2-app-kit = { version = "=0.2.2", features = ["NSOpenPanel", "NSSavePanel", "NSPanel", "NSResponder", "NSWindow", "NSApplication"] }
core-graphics = "=0.23.2"
core-foundation = "=0.9.4"

[[test]]
name = "window_hit"
harness = false

[dev-dependencies]
jpeg-encoder = "0.7.1"
